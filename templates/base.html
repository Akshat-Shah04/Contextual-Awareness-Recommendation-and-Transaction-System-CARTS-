<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CARTS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('shop') }}"><strong>CARTS</strong><span>Context-Aware Recommendation &amp; Transaction System</span></a>
    <nav class="nav">
      <a href="{{ url_for('shop') }}" class="{{ 'active' if active == 'shop' }}">Shop</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    </nav>
    <div class="dataset-badge" id="dataset-badge"></div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
